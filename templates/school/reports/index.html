{% extends "school/reports/_base.html" %}

{% block title %}Reports{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
        <h2 class="fw-bold mb-1">Reports</h2>
        <p class="text-muted mb-0">Select a report to view or export data</p>
    </div>
</div>

<!-- Reports Index Page -->
<div class="row g-3">
    {% for r in reports %}
    <div class="col-12 col-md-6 col-lg-4">
        <a href="{% url r.view %}" class="text-decoration-none">
            <div class="card border-0 shadow-sm report-card h-100">
                <div class="card-body">
                    <h5 class="fw-bold mb-2">{{ r.name }}</h5>
                    <p class="text-muted small mb-3">{{ r.desc }}</p>
                    <span class="btn btn-sm btn-outline-primary">View Report →</span>
                </div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
